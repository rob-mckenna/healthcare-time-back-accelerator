<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1510" width="1400" height="1305" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Second Shift Reduction Accelerator — Shift Closeout Architecture</title>
<desc id="diagram-desc">Architecture diagram for the Option A shift-closeout prototype. A nurse (hero) uses a Copilot Studio care-team experience to confirm patient and encounter, request a draft, review source references, and approve, reject, or request revision. Past the invocation boundary, the diagram distinguishes a solid, working P0 local deterministic simulation path from a dashed direct Copilot Studio-to-Foundry target path. ADR-20260813-011 resolves BLOCKER-001 path selection, but the binding is not connected, direct connected-agent validation remains NOT RUN under RISK-020, and BLOCKER-002 role authorization remains open. A separate isolated live Foundry evaluation passed 7 of 7 bounded cases and resolved BLOCKER-003; this evidence does not claim connected Copilot Studio integration. Exactly one Microsoft Foundry Shift Closeout Agent, grounded only in an approved synthetic FHIR-shaped source, produces structured output with source references. Deterministic controls outside the probabilistic generation validate identity, context, schema, safety, grounding, and correlation, failing closed on any gap. A human approval path and a minimal attributable audit event follow, with no chart write and no production action. A time-back view is labeled ILLUSTRATIVE ONLY. A correlation ID trace links request, generation, decision, and audit. Organization configuration is a cross-cutting concern, with Harborlight Children's Hospital as an example-only configuration and secrets kept separate. Persistent notices state DRAFT — HUMAN REVIEW REQUIRED, synthetic data only, and no diagnosis, treatment, triage, or medication recommendation.</desc>
<rect x="0" y="0" width="1620" height="1510" fill="#ffffff"/>
